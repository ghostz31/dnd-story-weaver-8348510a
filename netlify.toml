# Netlify configuration for Trame SPA

[build]
  command = "npm run build"
  publish = "dist"

# D&D Beyond Proxy
[[redirects]]
  from = "/api/dndbeyond/*"
  to = "https://character-service.dndbeyond.com/:splat"
  status = 200
  force = true

# SPA routing - redirect all routes to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Environment variables for Node
[build.environment]
  NODE_VERSION = "20"
